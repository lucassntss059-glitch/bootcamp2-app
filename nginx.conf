server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão: arquivos menores e carregamento mais rápido
    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;

    # Cache curto para CSS e JS
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
