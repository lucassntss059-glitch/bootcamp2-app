<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde Passa | Filmes e Séries</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fa-solid fa-film"></i> Onde<span>Passa</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pesquise qualquer filme ou série...">
                <button id="searchBtn" aria-label="Pesquisar"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>

        <!-- ABAS -->
        <nav class="tabs" aria-label="Seções do catálogo">
            <button class="tab-btn active" id="tabExplore" type="button">
                <i class="fa-solid fa-compass"></i> Explorar
            </button>
            <button class="tab-btn" id="tabFavorites" type="button">
                <i class="fa-solid fa-heart"></i> Favoritos
                <span class="fav-count" id="favCount">0</span>
            </button>

            <div class="auth-area">
                <span class="user-email" id="userEmail" hidden></span>
                <button class="tab-btn" id="loginBtn" type="button">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar
                </button>
                <button class="tab-btn" id="logoutBtn" type="button" hidden>
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="grid-container" id="catalogGrid">
            <!-- Cards gerados via JS -->
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal" aria-label="Fechar">&times;</button>
            <div class="modal-hero">
                <img id="modalBackdrop" class="modal-backdrop" src="" alt="Capa">
            </div>
            <div class="modal-body">
                <div class="modal-title-row">
                    <h2 id="modalTitle">Título</h2>
                    <button class="modal-fav-btn" id="modalFavBtn" type="button" hidden>
                        <i class="fa-regular fa-heart"></i> <span>Favoritar</span>
                    </button>
                </div>
                <p id="modalOverview" style="color: #cbd5e1; line-height: 1.6;"></p>

                <div class="streaming-section">
                    <h3><i class="fa-solid fa-tv" style="color: var(--blue-accent);"></i> Transmissão / Plataforma:</h3>
                    <div class="providers-badge" id="modalProviders" style="margin-top: 0.5rem;"></div>
                </div>

                <div>
                    <h3><i class="fa-solid fa-users" style="color: var(--blue-accent);"></i> Elenco Principal:</h3>
                    <p id="modalCast" style="color: var(--text-muted); margin-top: 0.3rem;"></p>
                </div>

                <div>
                    <h3><i class="fa-brands fa-youtube" style="color: #ef4444;"></i> Trailer Oficial:</h3>
                    <div class="video-container">
                        <iframe id="modalTrailer" src="" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE LOGIN / CADASTRO -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content auth-content">
            <button class="close-btn" id="closeAuth" aria-label="Fechar">&times;</button>
            <div class="modal-body">
                <h2>Entrar no OndePassa</h2>
                <p id="authMessage" class="auth-message">Entre para salvar seus favoritos em qualquer dispositivo.</p>
                <form id="authForm" class="auth-form">
                    <input type="email" id="authEmail" placeholder="Seu e-mail" required autocomplete="email">
                    <input type="password" id="authPassword" placeholder="Senha (mínimo 6 caracteres)" required minlength="6" autocomplete="current-password">
                    <div class="auth-actions">
                        <button type="submit" id="authSubmit" class="auth-primary">Entrar</button>
                        <button type="button" id="authSignup" class="auth-secondary">Criar conta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 OndePassa - Alimentado via API pública aberta (TVMaze API).</p>
    </footer>
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
